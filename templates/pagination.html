{%- if paginator.total_pages > 1 %}
  <nav class="pager" aria-label="分页">
    {%- if paginator.prev %}<a class="pager__link" href="{{ paginator.prev }}">上一页</a>{% else %}<span class="pager__link is-off">上一页</span>{% endif %}
    <span class="pager__info">{{ paginator.current_page }} / {{ paginator.total_pages }}</span>
    {%- if paginator.next %}<a class="pager__link" href="{{ paginator.next }}">下一页</a>{% else %}<span class="pager__link is-off">下一页</span>{% endif %}
  </nav>
{%- endif %}
